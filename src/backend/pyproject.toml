[project]
name = "flowfactory-backend"
version = "0.1.0"
description = "FlowFactory 后端"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "loguru>=0.7.3",
    "pgvector>=0.3.6",
    "redis>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501", "I001", "UP007", "UP035"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["settings*", "data_schema*", "service*"]

[tool.pytest.ini_options]
markers = [
    "integration: 需要外部 Postgres 等服务的集成测试",
]
