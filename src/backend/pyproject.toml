[project]
name = "flowfactory-backend"
version = "0.1.0"
description = "FlowFactory 后端"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "loguru>=0.7.3",
    "pgvector>=0.3.6",
    "redis>=5.2.0",
    "greenlet>=3.1.0",
    "celery>=5.4.0",
    "kombu>=5.4.0",
    "croniter>=4.0.0",
    "langgraph>=0.4.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3.0",
    "openai>=1.60.0",
    "temporalio>=1.8.0",
    "psycopg-pool>=3.2.0",
    "minio>=7.2.0",
    "pypdf>=5.0.0",
    "onnxruntime>=1.20.0",
    "tokenizers>=0.21.0",
    "pyjwt>=2.10.0",
    "argon2-cffi>=23.1.0",
    "ldap3>=2.9.1",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
    "langfuse>=2.60.0",
    "httpx>=0.28.0",
    "jsonschema>=4.23.0",
    "mcp>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest-asyncio>=0.25.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501", "I001", "UP007", "UP035"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["settings*", "data_schema*", "service*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: 需要外部 Postgres 等服务的集成测试",
]
